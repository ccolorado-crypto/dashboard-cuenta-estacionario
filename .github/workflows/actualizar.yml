name: Actualizar Dashboard

on:
  push:
    paths:
      - 'data/**'
      - 'generador_dashboard.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar Script y Crear HTML
        run: python generador_dashboard.py

      - name: Guardar el nuevo HTML en GitHub
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add public/index.html
          git commit -m "Actualización automática del dashboard" || echo "No hay cambios para subir"
          git push
